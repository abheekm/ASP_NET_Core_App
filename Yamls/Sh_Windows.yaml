name: Sh_Windows
description: ""
settings:
  disableCache: false
  vcs-steps: []
  build-steps:
  - key: runner_script
    name: sh
    disabled: false
    workDir: ""
    args:
      Shell: sh
      script: |-
        #Basic Runner Check
        echo "=== Windows Shell Basic Test ==="
        echo "User: $(whoami)"
        echo "Date: $(date)"
        echo "Home: $HOME"
        echo "Directory: $(pwd)"
        ls -la

        #Windows System Info
        echo "=== Windows System Info ==="

        echo "--- OS Version ---"
        cmd.exe /c ver

        echo "--- Disk Space ---"
        df -h .

        echo "--- CPU Info ---"
        wmic cpu get name 2>/dev/null | grep -v "Name"

        #Windows Network Test
        echo "=== Windows Network Test ==="

        echo "Ping google.com..."
        ping -n 3 google.com

        echo "DNS lookup..."
        nslookup google.com 8.8.8.8

        #Windows Parallel Task Test
        echo "=== Parallel Task Simulation (Windows) ==="

        task() {
          echo "Task $1 started"
          sleep $((RANDOM % 4 + 1))
          echo "Task $1 finished"
        }

        for i in 1 2 3 4; do
          task "$i" &
        done

        echo "Waiting..."
        wait
        echo "All tasks completed."

        #Windows File I/O + Hash
        echo "=== Windows File I/O Test ==="

        FILE=testfile.bin

        echo "Creating random file..."
        dd if=/dev/urandom of=$FILE bs=1K count=10 >/dev/null 2>&1

        echo "Hashing..."
        hash1=$(sha256sum $FILE | cut -d ' ' -f 1)

        cp $FILE copy.bin

        hash2=$(sha256sum copy.bin | cut -d ' ' -f 1)

        if [ "$hash1" = "$hash2" ]; then
          echo "Hash OK – Copy valid"
        else
          echo "Hash mismatch!"
          exit 1
        fi
    argsProtected: {}
  - key: runner_script
    name: single
    disabled: false
    workDir: ""
    args:
      Shell: sh
      script: 'echo "Directory: $(pwd)"'
    argsProtected: {}
  - key: runner_script
    name: one liner
    disabled: false
    workDir: ""
    args:
      Shell: sh
      script: echo "=== Parallel Task Simulation (Windows) ==="; task(){ echo "Task
        $1 started"; sleep $((RANDOM % 4 + 1)); echo "Task $1 finished"; }; for i
        in 1 2 3 4; do task "$i" & done; echo "Waiting..."; wait; echo "All tasks
        completed."
    argsProtected: {}
  artifacts: []
  variables: []
