name: Zsh_Linux
description: ""
settings:
  disableCache: false
  vcs-steps: []
  build-steps:
  - key: runner_script
    name: zsh
    disabled: false
    workDir: ""
    args:
      Shell: zsh
      script: |-
        #Hello World
        echo "Hello CI Runner! $(date)"

        #Environment Info
        echo "Running on: $(uname -a)"
        echo "User: $USER"
        echo "Home directory: $HOME"
        echo "Current directory: $(pwd)"
        echo "Available CPUs: $(nproc)"
        echo "Memory info:"
        free -h

        #File Operations & Loop
        echo "Running Windows Bash CI test..."

        mkdir -p ci_test_dir
        cd ci_test_dir || exit 1

        for i in {1..5}; do
          echo "Windows file $i" > "file_$i.txt"
        done

        echo "Files created:"
        ls -lh

        echo "Word count:"
        wc -w *.txt

        cd ..
        rm -rf ci_test_dir
        echo "Cleanup done."

        #Parallel Tasks & Conditional Logic
        echo "Starting CI stress test..."

        # Create files
        for i in {1..10}; do
            echo "File $i content" > "file_$i.txt"
        done

        # Run tasks in parallel
        for i in {1..10}; do
            {
                sleep $((RANDOM % 3))
                echo "Processing file_$i.txt: $(wc -c < file_$i.txt) bytes"
            } &
        done
        wait

        # Conditional logic
        for file in file_*.txt; do
            if [[ $(wc -c < $file) -gt 10 ]]; then
                echo "$file is large enough."
            else
                echo "$file is too small."
            fi
        done

        rm -f file_*.txt
        echo "CI stress test completed!"
    argsProtected: {}
  - key: runner_script
    name: single
    disabled: false
    workDir: ""
    args:
      Shell: zsh
      script: 'echo "Available CPUs: $(nproc)"'
    argsProtected: {}
  - key: runner_script
    name: one liner
    disabled: false
    workDir: ""
    args:
      Shell: zsh
      script: echo "Running Windows Bash CI test..."; mkdir -p ci_test_dir && cd ci_test_dir
        || exit 1; for i in {1..5}; do echo "Windows file $i" > "file_$i.txt"; done;
        echo "Files created:"; ls -lh; echo "Word count:"; wc -w *.txt; cd ..; rm
        -rf ci_test_dir; echo "Cleanup done."
    argsProtected: {}
  artifacts: []
  variables: []
